name: Sonarcloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: Run Sonarcloud
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.1.1

      - name: Add Sources to NuGet
        shell: pwsh
        run: |
          $configFile = Join-Path $PWD "nuget.config"

          nuget sources remove -name nuget_pipeline -configfile $configFile | Out-Host
          nuget sources add -source "https://api.nuget.org/v3/index.json" -configfile $configFile -name nuget_pipeline | Out-Host

          $username = "${{ secrets.DSSL_USERNAME }}"
          $token = "${{ secrets.DSSL_TOKEN }}"

          if ([string]::IsNullOrWhiteSpace($username) -or [string]::IsNullOrWhiteSpace($token)) {
            Write-Host "Skipping GitHub Packages source (missing secrets DSSL_USERNAME/DSSL_TOKEN)."
            exit 0
          }

          nuget sources remove -name github_pipeline -configfile $configFile | Out-Host
          nuget sources add -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -configfile $configFile -name github_pipeline -username $username -password $token -StorePasswordInClearText | Out-Host

      - name: Install SonarScanner
        shell: pwsh
        run: |
          try {
            dotnet tool update --global dotnet-sonarscanner
          }
          catch {
            dotnet tool install --global dotnet-sonarscanner
          }

      - name: Add dotnet tools to PATH
        shell: pwsh
        run: |
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: SonarCloud Begin
        id: sonar_begin
        shell: pwsh
        run: |
          $projectKey = "${{ vars.SONAR_PROJECT_KEY }}"
          $projectName = "${{ vars.SONAR_PROJECT_NAME }}"
          $organization = "${{ vars.SONAR_ORGANIZATION }}"
          $token = "${{ secrets.SONAR_TOKEN }}"

          if ([string]::IsNullOrWhiteSpace($projectKey)) { throw "Missing repo variable SONAR_PROJECT_KEY." }
          if ([string]::IsNullOrWhiteSpace($projectName)) { throw "Missing repo variable SONAR_PROJECT_NAME." }
          if ([string]::IsNullOrWhiteSpace($organization)) { throw "Missing repo variable SONAR_ORGANIZATION." }
          if ([string]::IsNullOrWhiteSpace($token)) { throw "Missing repo secret SONAR_TOKEN." }

          $beginArgs = @(
            "sonarscanner", "begin",
            "/k:$projectKey",
            "/n:$projectName",
            "/o:$organization",
            "/d:sonar.token=$token",
            "/d:sonar.host.url=https://sonarcloud.io",
            "/d:sonar.cs.vstest.reportsPaths=**/TestResults/*.trx",
            "/d:sonar.exclusions=**/Migrations/**,**/packages/**"
          )

          $coverageExclusions = "${{ vars.SONAR_COVERAGE_EXCLUSIONS }}"
          if (-not [string]::IsNullOrWhiteSpace($coverageExclusions)) {
            $beginArgs += "/d:sonar.coverage.exclusions=$coverageExclusions"
          }

          $cpdExclusions = "${{ vars.SONAR_CPD_EXCLUSIONS }}"
          if (-not [string]::IsNullOrWhiteSpace($cpdExclusions)) {
            $beginArgs += "/d:sonar.cpd.exclusions=$cpdExclusions"
          }

          dotnet @beginArgs

      - name: Restore Packages
        run: nuget restore "${{ github.workspace }}\\SonarOldDotnet.sln"

      - name: Build Solution
        run: msbuild "${{ github.workspace }}\\SonarOldDotnet.sln" /p:Configuration=Release

      - name: Run All Tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Recurse -Filter *.dll |
                    Where-Object { $_.Name -match '(.Test|.Tests).dll$' -and $_.FullName -match 'bin' -and $_.Name -notmatch 'CoreTests' }

          if ($tests.Count -eq 0) {
            Write-Host "No test DLLs found."
            exit 1
          }

          foreach ($dll in $tests) {
            Write-Host "Running tests in $($dll.FullName)"
            & "vstest.console.exe" "$($dll.FullName)" /Logger:trx
          }

      - name: SonarCloud End
        if: ${{ always() && steps.sonar_begin.outcome == 'success' }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
